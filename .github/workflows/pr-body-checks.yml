name: Pull-request body checks

# Reusable workflow for the two checks that read a pull-request body (UAMS-Web/uams-ci-workflows#24):
# `Attribution footer` fails a body carrying the harness attribution footer, and `Closing keywords`
# fails a body holding a closing directive across a line break or one that leaves a linked issue
# unclosed. Both read the body from the API, so an edit that lands between the event and the run is
# still the text that is checked.
#
# A caller calls it from a workflow on all five trigger types, because a body can change at any of them:
#
#   on:
#     pull_request:
#       types: [opened, edited, reopened, ready_for_review, synchronize]
#   jobs:
#     checks:
#       uses: UAMS-Web/uams-ci-workflows/.github/workflows/pr-body-checks.yml@<tag or commit>
#       permissions:
#         contents: read
#         pull-requests: read
#         issues: read
#
# A job called this way reports its check as `<caller job id> / <called job name>`, so the called jobs'
# names alone cannot be the required status check contexts `Attribution footer` and `Closing keywords`.
# The workflow therefore exposes each job's result as an output (`footer` and `keywords`), and the
# caller carries one small job per context, named exactly as the ruleset requires, that fails unless
# that output is `success` (UAMS-Web/uams-ci-workflows#24).
#
# Every job checks out the caller's repository and runs the synced scripts under
# `.claude/skills/writing-pull-requests/scripts/`, so the caller must carry them.
#
# Both jobs carry `if: vars.RUN_REMOTE_CI != 'false'`; `vars` is the caller's, so a private repository
# where the variable is `false` skips them before a runner is dispatched and bills no minutes. A skipped
# job reports `skipped`, and a skipped required check counts as success, so a skipped run is not a
# passing run: nothing has read the pull request while the switch is off.
#
# A pull request opened by `dependabot[bot]` is not checked by the footer job. Its body is generated from
# upstream release notes that nobody on the repository wrote and nobody can edit. The skip is inside the
# step so the step can print why it skipped.

on:
  workflow_call:
    outputs:
      footer:
        description: The result of the Attribution footer job (success, failure, cancelled or skipped).
        value: ${{ jobs.attribution-footer.result }}
      keywords:
        description: The result of the Closing keywords job (success, failure, cancelled or skipped).
        value: ${{ jobs.closing-keywords.result }}

# Nothing at the workflow level; each job states the scopes it needs, within what the caller grants.
permissions: {}

jobs:
  attribution-footer:
    name: Attribution footer
    if: vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the body for the attribution footer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          author=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.user.login')
          if [ "$author" = "dependabot[bot]" ]; then
            echo "Skipped: the body of a Dependabot pull request is generated from upstream release notes."
            exit 0
          fi
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node .claude/skills/writing-pull-requests/scripts/check-attribution-footer.mjs "$RUNNER_TEMP/body.md"

  closing-keywords:
    name: Closing keywords
    if: vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - name: Check the body for a closing directive across a line break
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node .claude/skills/writing-pull-requests/scripts/check-closing-keyword-across-lines.mjs --file "$RUNNER_TEMP/body.md"

      - name: Check that the body closes every issue the pull request is linked to
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner="${REPO%%/*}"
          name="${REPO#*/}"
          gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { closingIssuesReferences(first: 50) { totalCount nodes { number repository { nameWithOwner } } } } } }' \
            -f owner="$owner" -f name="$name" -F number="$NUMBER" > "$RUNNER_TEMP/linked.json"
          node .claude/skills/writing-pull-requests/scripts/check-development-links.mjs --repo "$REPO" --body-file "$RUNNER_TEMP/body.md" --graphql-file "$RUNNER_TEMP/linked.json"
